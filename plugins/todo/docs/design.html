<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Todo 설계도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 설계도 한 장, 글은 최소 */
:root {
  --bg: #f6f8f8;
  --surface: #ffffff;
  --fg: #17211f;
  --muted: #5b6b68;
  --line: #c9d4d2;
  --accent: #0f766e;
  --accent-soft: #dff1ee;
  --warn: #b45309;
  --warn-soft: #fbefdc;
  --off: #8a9794;
  --off-soft: #eceff0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --surface: #19211f; --fg: #e5ecea; --muted: #9aaba7; --line: #34413e;
    --accent: #4fc4b5; --accent-soft: #173a36; --warn: #f0a75a; --warn-soft: #3a2a17;
    --off: #7b8986; --off-soft: #232c2a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --surface: #19211f; --fg: #e5ecea; --muted: #9aaba7; --line: #34413e;
  --accent: #4fc4b5; --accent-soft: #173a36; --warn: #f0a75a; --warn-soft: #3a2a17;
  --off: #7b8986; --off-soft: #232c2a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { margin: 0 0 -16px; font-size: 19px; font-weight: 700; }
.cap { margin: 4px 6px 10px; font-size: 14.5px; color: var(--muted); }
.tools { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
.tools th, .tools td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tools th { font-weight: 700; white-space: nowrap; width: 1%; }
.tools code { font-family: var(--font-mono); font-size: 12.5px; background: var(--off-soft); padding: 0 4px; border-radius: 4px; }
.tools .st { white-space: nowrap; width: 1%; font-size: 12px; }
.st.ok { color: var(--accent); } .st.part { color: var(--warn); } .st.no { color: var(--off); }
@media (max-width: 640px) { .tools th, .tools td { padding: 6px 6px; } }

.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.states { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.states-t { font-size: 13px; color: var(--muted); margin-right: 2px; }
.state { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1.3px solid var(--accent); background: var(--accent-soft); font-size: 13px; }
.state code { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.state.doing { border-color: var(--warn); background: var(--warn-soft); }
.state.done { border-color: var(--line); background: var(--surface); }
.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.diagram svg { display: block; min-width: 860px; width: 100%; height: auto; }
svg text { font-family: var(--font-body); fill: var(--fg); }
svg .t-title { font-size: 18px; font-weight: 700; }
svg .t-ch { font-size: 15px; font-weight: 500; }
svg .t-sub { font-size: 13.5px; fill: var(--muted); }
svg .t-acc { font-size: 14px; fill: var(--accent); font-weight: 700; letter-spacing: 0.04em; }
svg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg .step { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
svg .store { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
svg .ghost { fill: none; stroke: var(--off); stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .arrow { stroke: var(--muted); stroke-width: 1.4; fill: none; }
svg .arrow-acc { stroke: var(--accent); stroke-width: 1.8; fill: none; }
svg .arrow-dash { stroke: var(--off); stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
svg .bracket { stroke: var(--accent); stroke-width: 1.2; fill: none; }
svg .head { fill: var(--muted); }
svg .head-acc { fill: var(--accent); }
svg .head-off { fill: var(--off); }
svg .num { fill: var(--accent); }
svg .pill { fill: var(--surface); stroke: var(--accent); stroke-width: 1; }
svg .pill-t { font-size: 11.5px; font-weight: 500; fill: var(--accent); }
svg .pill-now { fill: var(--warn); }
svg .gate { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 5 3; }
svg .gate-line { stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 3 3; fill: none; }
svg .gate-dot { fill: var(--warn); }
svg .plug { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; }
svg .t-mono { font-family: var(--font-mono); font-size: 12.5px; fill: var(--muted); }
svg .t-gate { font-size: 14.5px; font-weight: 700; fill: var(--warn); }
svg .num-t { fill: var(--surface); font-size: 12px; font-weight: 700; }

</style>

<div class="wrap">
  <header class="head">
    <h1>Todo 설계도</h1>
    <div class="states" aria-label="할 일 상태">
      <span class="states-t">할 일 상태</span>
      <span class="state"><b>할 일</b><code>todo</code></span>
      <span class="state doing"><b>작업 중</b><code>in_progress</code></span>
      <span class="state done"><b>완료</b><code>done</code></span>
    </div>
  </header>

  <div class="diagram">
    <svg viewBox="115 50 1120 252" role="img" aria-label="/todo:add 로 티켓을 만들어 할 일 목록에 등록하고, /todo 화면에서 확인한 뒤, /start 부터 /finish 까지 처리하는 흐름도. 목표는 /todo:goal 로 할 일에 표시한다">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
        <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-acc"/></marker>
        <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-off"/></marker>
      </defs>

      <!-- 1 등록 -->
      <rect x="250" y="70" width="170" height="104" rx="10" class="step"/>
      <circle cx="272" cy="94" r="11" class="num"/><text x="272" y="98" text-anchor="middle" class="num-t">1</text>
      <text x="335" y="120" text-anchor="middle" class="t-title">등록</text>
      <text x="335" y="141" text-anchor="middle" class="t-sub">제목 · 메모</text>
      <rect x="295" y="150" width="80" height="18" rx="9" class="pill"/>
      <text x="335" y="163" text-anchor="middle" class="pill-t"><tspan>/todo:add</tspan></text>
      <path d="M420,122 L478,122" class="arrow-acc" marker-end="url(#aha)"/>

      <!-- 티켓 생성: 등록할 때 승인 뒤 -->
      <path d="M335,226 L335,176" class="gate-line"/>
      <circle cx="335" cy="174" r="4.5" class="gate-dot"/>
      <rect x="265" y="226" width="140" height="40" rx="20" class="gate"/>
      <text x="335" y="251" text-anchor="middle" class="t-gate">티켓 생성</text>
      <rect x="286" y="272" width="98" height="18" rx="9" class="pill"/>
      <text x="335" y="285" text-anchor="middle" class="pill-t"><tspan>jira-create.py</tspan></text>

      <!-- 할 일 목록 -->
      <path d="M480,92 L480,152 A90,12 0 0 0 660,152 L660,92" class="store"/>
      <ellipse cx="570" cy="92" rx="90" ry="12" class="store"/>
      <text x="570" y="128" text-anchor="middle" class="t-title">할 일 목록</text>
      <rect x="534" y="138" width="72" height="18" rx="9" class="pill"/>
      <text x="570" y="151" text-anchor="middle" class="pill-t">todo.jsonl</text>
      <path d="M660,122 L718,122" class="arrow-acc" marker-end="url(#aha)"/>

      <!-- 목표: 할 일에 표시만 -->
      <path d="M570,226 L570,168" class="gate-line"/>
      <circle cx="570" cy="166" r="4.5" class="gate-dot"/>
      <rect x="500" y="226" width="140" height="40" rx="20" class="gate"/>
      <text x="570" y="251" text-anchor="middle" class="t-gate">목표 설정</text>
      <rect x="530" y="272" width="80" height="18" rx="9" class="pill"/>
      <text x="570" y="285" text-anchor="middle" class="pill-t"><tspan>/todo:goal</tspan></text>

      <!-- 2 확인 -->
      <rect x="720" y="70" width="170" height="104" rx="10" class="step"/>
      <circle cx="742" cy="94" r="11" class="num"/><text x="742" y="98" text-anchor="middle" class="num-t">2</text>
      <text x="805" y="120" text-anchor="middle" class="t-title">확인</text>
      <text x="805" y="141" text-anchor="middle" class="t-sub">번호 · 경과일 · 목표</text>
      <rect x="780" y="150" width="50" height="18" rx="9" class="pill"/>
      <text x="805" y="163" text-anchor="middle" class="pill-t"><tspan>/todo</tspan></text>
      <path d="M890,122 L928,122" class="arrow-acc" marker-end="url(#aha)"/>

      <!-- 3 처리 -->
      <rect x="930" y="70" width="170" height="104" rx="10" class="step"/>
      <circle cx="952" cy="94" r="11" class="num"/><text x="952" y="98" text-anchor="middle" class="num-t">3</text>
      <text x="1015" y="120" text-anchor="middle" class="t-title">처리</text>
      <text x="1015" y="141" text-anchor="middle" class="t-sub">아래 상세</text>
      <rect x="953" y="150" width="124" height="18" rx="9" class="pill"/>
      <text x="1015" y="163" text-anchor="middle" class="pill-t"><tspan>/start → /finish</tspan></text>
    </svg>
  </div>

  <h2>Todo 처리 상세</h2>
  <div class="diagram">
    <svg viewBox="0 30 1120 334" role="img" aria-label="할 일 목록에서 건을 골라 시작하며 세션을 티켓과 연결하고, 새 세션에서 작업하고(작업 내용은 세션 기록에 남고 /check 로 상태를 본다), 완료한 뒤 세션 기록으로 작업 내용을 정리해 작업 내역을 기록하고, 완료 결과를 할 일 목록에 업데이트하는 흐름도. 할 일 상태가 바뀌면 지라 티켓 상태가 따라간다">
      <!-- 작업 줄 -->
      <rect x="20" y="50" width="240" height="64" rx="10" class="step"/>
      <text x="140" y="78" text-anchor="middle" class="t-title">시작</text>
      <rect x="112" y="89" width="56" height="18" rx="9" class="pill"/>
      <text x="140" y="102" text-anchor="middle" class="pill-t"><tspan>/start</tspan></text>

      <!-- 시작 아래: 할 일 목록에서 건을 가져온다 -->
      <path d="M100,160 L100,116" class="arrow-acc" marker-end="url(#aha)"/>
      <path d="M180,116 L180,158" class="arrow-acc" marker-end="url(#aha)"/>
      <rect x="188" y="129" width="78" height="18" rx="9" class="pill"/>
      <text x="227" y="142" text-anchor="middle" class="pill-t"><tspan>in_progress</tspan></text>
      <path d="M40,170 L40,232 A100,10 0 0 0 240,232 L240,170" class="store"/>
      <ellipse cx="140" cy="170" rx="100" ry="10" class="store"/>
      <text x="140" y="200" text-anchor="middle" class="t-ch" style="font-weight:700">할 일 목록</text>
      <rect x="104" y="211" width="72" height="18" rx="9" class="pill"/>
      <text x="140" y="224" text-anchor="middle" class="pill-t"><tspan>todo.jsonl</tspan></text>
      <path d="M260,82 L438,82" class="arrow-acc" marker-end="url(#aha)"/>
      <rect x="440" y="50" width="240" height="64" rx="10" class="step"/>
      <text x="560" y="78" text-anchor="middle" class="t-title">작업</text>
      <rect x="485" y="89" width="150" height="18" rx="9" class="pill"/>
      <text x="560" y="102" text-anchor="middle" class="pill-t"><tspan>세션 ↔ 티켓 연결 · /check</tspan></text>
      <path d="M680,82 L858,82" class="arrow-acc" marker-end="url(#aha)"/>
      <rect x="860" y="50" width="240" height="64" rx="10" class="step"/>
      <text x="980" y="78" text-anchor="middle" class="t-title">완료</text>
      <rect x="950" y="89" width="60" height="18" rx="9" class="pill"/>
      <text x="980" y="102" text-anchor="middle" class="pill-t"><tspan>/finish</tspan></text>

      <!-- 개입: 작업 시작 때 세션과 티켓 연결 -->
      <path d="M349,140 L349,86" class="gate-line"/>
      <circle cx="349" cy="82" r="4.5" class="gate-dot"/>
      <rect x="279" y="140" width="140" height="40" rx="20" class="gate"/>
      <text x="349" y="165" text-anchor="middle" class="t-gate">티켓 연결</text>
      <rect x="304" y="186" width="90" height="18" rx="9" class="pill"/>
      <text x="349" y="199" text-anchor="middle" class="pill-t"><tspan>ticket_link.py</tspan></text>
      <!-- 할 일 상태가 바뀌면 지라 티켓이 따라간다 -->
      <path d="M140,246 L140,262" class="gate-line"/>
      <circle cx="140" cy="246" r="4.5" class="gate-dot"/>
      <rect x="56" y="262" width="168" height="40" rx="20" class="gate"/>
      <text x="140" y="287" text-anchor="middle" class="t-gate">티켓 상태 동기화</text>
      <rect x="87" y="308" width="106" height="18" rx="9" class="pill"/>
      <text x="140" y="321" text-anchor="middle" class="pill-t"><tspan>todo.py · jira_api</tspan></text>

      <!-- 작업 내용 기록 위치 -->
      <path d="M560,114 L560,158" class="arrow-acc" marker-end="url(#aha)"/>
      <text x="568" y="142" class="t-sub">기록</text>
      <path d="M430,170 L430,232 A130,10 0 0 0 690,232 L690,170" class="store"/>
      <ellipse cx="560" cy="170" rx="130" ry="10" class="store"/>
      <text x="560" y="196" text-anchor="middle" class="t-ch" style="font-weight:700">세션 기록</text>
      <text x="560" y="214" text-anchor="middle" class="t-mono">~/.claude/projects/*.jsonl</text>
      <rect x="498" y="221" width="124" height="18" rx="9" class="pill"/>
      <text x="560" y="234" text-anchor="middle" class="pill-t"><tspan>자동 · Claude Code</tspan></text>

      <!-- 완료 후: 작업 내용 정리 → 티켓 갱신 -->
      <path d="M980,114 L980,177" class="arrow-acc" marker-end="url(#aha)"/>
      <rect x="890" y="179" width="180" height="56" rx="10" class="step"/>
      <text x="980" y="200" text-anchor="middle" class="t-ch" style="font-weight:700">작업 내용 정리</text>
      <rect x="915" y="208" width="130" height="18" rx="9" class="pill"/>
      <text x="980" y="221" text-anchor="middle" class="pill-t"><tspan>work-summary 에이전트</tspan></text>
      <path d="M690,201 L888,201" class="arrow-dash" marker-end="url(#aho)"/>
      <path d="M980,257 L980,239" class="gate-line"/>
      <circle cx="980" cy="235" r="4.5" class="gate-dot"/>
      <rect x="890" y="257" width="180" height="40" rx="20" class="gate"/>
      <text x="980" y="282" text-anchor="middle" class="t-gate">티켓에 작업 내역 기록</text>
      <rect x="917" y="303" width="126" height="18" rx="9" class="pill"/>
      <text x="980" y="316" text-anchor="middle" class="pill-t"><tspan>worklog-update.py</tspan></text>
      <!-- 완료 → 할 일 목록 갱신 (위로 돌아감) -->
      <path d="M1100,82 L1112,82 L1112,352 L22,352 L22,206 L38,206" class="arrow-acc" marker-end="url(#aha)"/>
      <rect x="540" y="326" width="44" height="18" rx="9" class="pill"/>
      <text x="562" y="339" text-anchor="middle" class="pill-t"><tspan>done</tspan></text>

    </svg>
  </div>

</div>


</body></html>
